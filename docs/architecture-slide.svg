<text x="426" y="520" font-size="10.5" fill="#16202b">Detects oil and separates it from look-alikes,</text>
<text x="426" y="538" font-size="10.5" fill="#16202b">reconstructs the release point with stated uncertainty,</text>
<text x="426" y="556" font-size="10.5" fill="#16202b">forecasts movement, finds vessels the radar sees but</text>
<text x="426" y="574" font-size="10.5" fill="#16202b">AIS does not, and produces an explainable ranked</text>
<text x="426" y="592" font-size="10.5" fill="#16202b">shortlist with an auditable chain of custody.</text>

