[project]
name = "oceanspill"
version = "0.1.0"
description = "OceanSpill data pipeline: real case facts, SAR catalogues, metocean forcing and AIS behind swappable providers"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "numpy>=2.0",
]

[project.scripts]
oceanspill = "oceanspill.cli:main"
oceanspill-train = "oceanspill.ml.train:main"
oceanspill-api = "oceanspill.api.cli:main"

[project.optional-dependencies]
sar = [
    "imagecodecs>=2024.1",
    "tifffile>=2024.8",
]
ml = [
    "onnx>=1.16",
    "onnxscript>=0.2",
    "torch>=2.4",
]
cmems = [
    "copernicusmarine>=2.0",
]
api = [
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "geoalchemy2>=0.15",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9",
    "pyotp>=2.9",
    "python-multipart>=0.0.9",
    "reportlab>=4.2",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real network services (run with -m live)"]
addopts = "-m 'not live'"
